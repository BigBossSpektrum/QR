# GitHub Pages configuration
title: "Generador QR"
description: "Generador de códigos QR con backend en Clever Cloud"
baseurl: ""
url: "https://bigbossspektrum.github.io"

# Jekyll configuration
markdown: kramdown
highlighter: rouge
theme: minima

# Exclude files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Include files
include:
  - _config.yml

# GitHub Pages specific
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
