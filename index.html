<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR - Sistema Híbrido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --light-bg: #f8fafc;
        }

        body {
            background: linear-gradient(135deg, var(--light-bg) 0%, #e2e8f0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-server { background-color: #dcfce7; color: #166534; }
        .status-local { background-color: #dbeafe; color: #1e40af; }
        .status-error { background-color: #fee2e2; color: #991b1b; }

        .qr-result {
            text-align: center;
            margin-top: 2rem;
        }

        .qr-canvas {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            background: white;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1><i class="fas fa-qrcode"></i> Generador QR</h1>
            <p class="text-muted">Sistema híbrido: Servidor + Local</p>
            <div id="statusBadge" class="status-badge status-local">🔄 Inicializando...</div>
        </div>

        <!-- Configuración del Modo -->
        <div class="card mb-4">
            <div class="card-header">
                <h5><i class="fas fa-cog"></i> Configuración</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label"><strong>Modo de Operación:</strong></label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="modo" id="modoAuto" value="auto" checked>
                        <label class="form-check-label" for="modoAuto">
                            <strong>🤖 Automático</strong> - Intenta servidor, fallback a local
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="modo" id="modoServidor" value="servidor">
                        <label class="form-check-label" for="modoServidor">
                            <strong>🌐 Solo Servidor</strong> - Usar backend de Clever Cloud
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="modo" id="modoLocal" value="local">
                        <label class="form-check-label" for="modoLocal">
                            <strong>💻 Solo Local</strong> - Generar QR directamente en el navegador
                        </label>
                    </div>
                </div>
                
                <div id="serverConfig">
                    <label for="serverUrl" class="form-label">URL del Servidor:</label>
                    <input type="url" class="form-control" id="serverUrl" 
                           value="https://app-8532e8b1-f91a-4f4a-8ee6-f0d6ab281f3c.cleverapps.io"
                           placeholder="https://app-8532e8b1-f91a-4f4a-8ee6-f0d6ab281f3c.cleverapps.io">
                    <div class="form-text">URL de tu aplicación Django en Clever Cloud</div>
                </div>
            </div>
        </div>

        <!-- Formulario Principal -->
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-link"></i> Generar Código QR</h5>
            </div>
            <div class="card-body">
                <form id="qrForm">
                    <div class="mb-3">
                        <label for="url" class="form-label">URL de Destino:</label>
                        <input type="url" class="form-control" id="url" required 
                               placeholder="https://ejemplo.com">
                        <div class="form-text">URL a la que quieres que redirija el QR</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción (opcional):</label>
                        <input type="text" class="form-control" id="descripcion" 
                               placeholder="Mi sitio web">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100" id="generateBtn">
                        <i class="fas fa-magic"></i> Generar QR
                    </button>
                </form>
            </div>
        </div>

        <!-- Resultado del QR -->
        <div id="qrResult" class="card mt-4" style="display: none;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-check-circle text-success"></i> QR Generado</h5>
                <span id="qrMode" class="status-badge status-local">Local</span>
            </div>
            <div class="card-body text-center">
                <div class="qr-canvas mb-3">
                    <canvas id="qrCanvas"></canvas>
                </div>
                
                <div class="mb-3">
                    <label class="form-label"><strong>URL del QR:</strong></label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="qrUrl" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard()">
                            <i class="fas fa-copy"></i> Copiar
                        </button>
                    </div>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <button class="btn btn-success" onclick="downloadQR()">
                        <i class="fas fa-download"></i> Descargar PNG
                    </button>
                    <button class="btn btn-info" onclick="generateNew()">
                        <i class="fas fa-plus"></i> Generar Otro
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        let currentQRData = null;
        let isQRCodeLoaded = false;

        // Configuración
        const CONFIG = {
            serverUrl: 'https://app-8532e8b1-f91a-4f4a-8ee6-f0d6ab281f3c.cleverapps.io',
            endpoints: {
                generar: '/backend/generar-qr/',
                health: '/admin/'
            }
        };

        // Verificar QRCode library
        function checkQRCodeLibrary() {
            return new Promise((resolve) => {
                if (typeof QRCode !== 'undefined') {
                    isQRCodeLoaded = true;
                    updateStatus('🟢 QRCode library loaded', 'status-local');
                    resolve(true);
                    return;
                }

                let attempts = 0;
                const maxAttempts = 50;
                
                const checkInterval = setInterval(() => {
                    attempts++;
                    if (typeof QRCode !== 'undefined') {
                        isQRCodeLoaded = true;
                        clearInterval(checkInterval);
                        updateStatus('🟢 QRCode library ready', 'status-local');
                        resolve(true);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkInterval);
                        updateStatus('❌ QRCode library failed to load', 'status-error');
                        resolve(false);
                    }
                }, 100);
            });
        }

        // Actualizar estado
        function updateStatus(message, className) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = message;
            badge.className = `status-badge ${className}`;
        }

        // Verificar servidor
        async function checkServerHealth() {
            try {
                const response = await fetch(`${CONFIG.serverUrl}${CONFIG.endpoints.health}`, {
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                updateStatus('🟢 Servidor disponible', 'status-server');
                return true;
            } catch (error) {
                updateStatus('🔴 Servidor no disponible', 'status-error');
                return false;
            }
        }

        // Generar QR en el servidor
        async function generateServerQR(url, descripcion) {
            try {
                const response = await fetch(`${CONFIG.serverUrl}${CONFIG.endpoints.generar}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        descripcion: descripcion || ''
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                
                // Generar QR visual
                await QRCode.toCanvas(document.getElementById('qrCanvas'), data.redirect_url, {
                    width: 250,
                    margin: 2,
                    color: {
                        dark: '#000000',
                        light: '#FFFFFF'
                    }
                });

                currentQRData = {
                    url: url,
                    qrUrl: data.redirect_url,
                    descripcion: descripcion,
                    mode: 'servidor',
                    codigo: data.codigo
                };

                document.getElementById('qrUrl').value = data.redirect_url;
                document.getElementById('qrMode').textContent = '🌐 Servidor';
                document.getElementById('qrMode').className = 'status-badge status-server';
                
                return true;
            } catch (error) {
                console.error('Server QR generation failed:', error);
                return false;
            }
        }

        // Generar QR localmente
        async function generateLocalQR(url, descripcion) {
            try {
                if (!isQRCodeLoaded) {
                    throw new Error('QRCode library not loaded');
                }

                await QRCode.toCanvas(document.getElementById('qrCanvas'), url, {
                    width: 250,
                    margin: 2,
                    color: {
                        dark: '#000000',
                        light: '#FFFFFF'
                    }
                });

                currentQRData = {
                    url: url,
                    qrUrl: url,
                    descripcion: descripcion,
                    mode: 'local'
                };

                document.getElementById('qrUrl').value = url;
                document.getElementById('qrMode').textContent = '💻 Local';
                document.getElementById('qrMode').className = 'status-badge status-local';
                
                return true;
            } catch (error) {
                console.error('Local QR generation failed:', error);
                return false;
            }
        }

        // Manejar envío del formulario
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const descripcion = document.getElementById('descripcion').value;
            const modo = document.querySelector('input[name="modo"]:checked').value;
            
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando...';
            
            let success = false;
            
            try {
                if (modo === 'local') {
                    success = await generateLocalQR(url, descripcion);
                } else if (modo === 'servidor') {
                    success = await generateServerQR(url, descripcion);
                } else { // modo auto
                    // Intentar servidor primero
                    success = await generateServerQR(url, descripcion);
                    if (!success) {
                        // Fallback a local
                        success = await generateLocalQR(url, descripcion);
                    }
                }
                
                if (success) {
                    document.getElementById('qrResult').style.display = 'block';
                    document.getElementById('qrResult').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('❌ Error: No se pudo generar el código QR. Intenta recargar la página.');
                }
                
            } catch (error) {
                console.error('QR generation error:', error);
                alert('❌ Error inesperado al generar el QR.');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fas fa-magic"></i> Generar QR';
            }
        }

        // Copiar al portapapeles
        function copyToClipboard() {
            const urlField = document.getElementById('qrUrl');
            urlField.select();
            document.execCommand('copy');
            
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Copiado!';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 2000);
        }

        // Descargar QR
        function downloadQR() {
            if (!currentQRData) return;
            
            const canvas = document.getElementById('qrCanvas');
            const link = document.createElement('a');
            link.download = `qr-${currentQRData.descripcion || 'codigo'}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // Generar nuevo QR
        function generateNew() {
            document.getElementById('qrResult').style.display = 'none';
            document.getElementById('url').focus();
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Inicializando Generador QR...');
            
            // Verificar QRCode library
            const qrReady = await checkQRCodeLibrary();
            
            // Verificar servidor
            await checkServerHealth();
            
            // Event listeners
            document.getElementById('qrForm').addEventListener('submit', handleFormSubmit);
            
            // Actualizar URL del servidor cuando cambie
            document.getElementById('serverUrl').addEventListener('input', function() {
                CONFIG.serverUrl = this.value;
            });
            
            if (qrReady) {
                updateStatus('✅ Sistema listo', 'status-local');
            } else {
                updateStatus('⚠️ Funcionalidad limitada', 'status-error');
            }
            
            console.log('✅ Generador QR inicializado');
        });
    </script>
</body>
</html>
